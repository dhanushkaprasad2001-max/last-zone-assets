name: Deploy LAST ZONE Character Gallery

on:
  push:
    branches: ["main"]
    paths:
      - "preview.html"
      - "characters.json"
      - "characters/**"
      - ".github/workflows/deploy-nero-preview.yml"
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare gallery website
        run: |
          mkdir -p public
          cp preview.html public/index.html
          cp characters.json public/characters.json
          if [ -d characters ]; then
            cp -R characters public/characters
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

name: Inspect NERO 1 model ZIP
on:
  push:
    paths:
      - 'Nero 1.zip'
      - 'tools/repair_nero_assets.py'
      - '.github/workflows/inspect-nero-1.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  inspect-model:
    runs-on: ubuntu-latest
    steps:
      - name: Check out assets
        uses: actions/checkout@v4
      - name: Inspect ZIP and model files
        run: |
          set -e
          test -s "Nero 1.zip"
          python3 - <<'PY'
          import zipfile, os, json, struct, hashlib
          from collections import Counter
          p = "Nero 1.zip"
          out = ["NERO 1 ZIP INSPECTION REPORT", "="*32]
          out.append(f"Archive size: {os.path.getsize(p):,} bytes")
          try:
              z = zipfile.ZipFile(p)
              bad = z.testzip()
              out.append("ZIP integrity: PASS" if bad is None else f"ZIP integrity: FAIL at {bad}")
              infos = z.infolist()
              out.append(f"File entries: {len(infos)}")
              for i in infos:
                  out.append(f"{i.file_size:>12,} bytes  {i.filename}")
              names = [i.filename for i in infos if not i.is_dir()]
              glbs = [n for n in names if n.lower().endswith('.glb')]
              fbxs = [n for n in names if n.lower().endswith('.fbx')]
              images = [n for n in names if n.lower().endswith(('.png','.jpg','.jpeg','.tga','.webp'))]
              out.append(f"\nGLB files: {len(glbs)} | FBX files: {len(fbxs)} | image textures: {len(images)}")
              hashes = {}
              for n in names:
                  base = os.path.basename(n).lower()
                  if 'lod' in base or base.endswith('.glb'):
                      hashes[n] = hashlib.sha256(z.read(n)).hexdigest()
              lod_groups = {}
              for n,h in hashes.items():
                  key = os.path.basename(n).lower().replace('lod0','lodX').replace('lod1','lodX').replace('lod2','lodX')
                  lod_groups.setdefault(key, []).append((n,h))
              for k, vals in lod_groups.items():
                  if len(vals)>1:
                      out.append("LOD hash comparison: " + ("IDENTICAL files detected" if len(set(h for _,h in vals))==1 else "Different file hashes") + " :: " + ", ".join(n for n,_ in vals))
              for n in glbs:
                  b=z.read(n); out.append(f"\nGLB ANALYSIS: {n}")
                  if len(b)<20 or b[:4]!=b'glTF':
                      out.append("GLB header: INVALID"); continue
                  version,total=struct.unpack_from('<II',b,4)
                  out.append(f"GLB header: valid magic | version={version} | declared_length={total} | actual_length={len(b)}")
                  pos=12; doc=None; bin_chunks=[]
                  while pos+8<=len(b):
                      ln,typ=struct.unpack_from('<II',b,pos); pos+=8
                      chunk=b[pos:pos+ln]; pos+=ln
                      if typ==0x4E4F534A:
                          try: doc=json.loads(chunk.decode('utf-8').rstrip(' \t\r\n\0'))
                          except Exception as e: out.append(f"JSON chunk parse error: {e}")
                      elif typ==0x004E4942: bin_chunks.append(len(chunk))
                  if doc:
                      out.append(f"Meshes={len(doc.get('meshes',[]))}, nodes={len(doc.get('nodes',[]))}, skins={len(doc.get('skins',[]))}, animations={len(doc.get('animations',[]))}, materials={len(doc.get('materials',[]))}, images={len(doc.get('images',[]))}, textures={len(doc.get('textures',[]))}")
                      out.append(f"Embedded BIN chunk bytes: {bin_chunks}")
                      for si,s in enumerate(doc.get('skins',[])):
                          out.append(f"Skin {si}: joints={len(s.get('joints',[]))}")
                      for ai,a in enumerate(doc.get('animations',[])):
                          out.append(f"Animation {ai+1}: {a.get('name','(unnamed)')} | samplers={len(a.get('samplers',[]))} | channels={len(a.get('channels',[]))}")
                      for mi,m in enumerate(doc.get('meshes',[])):
                          for pi,pr in enumerate(m.get('primitives',[])):
                              out.append(f"Mesh {mi} primitive {pi}: attributes={list(pr.get('attributes',{}).keys())} | indices={pr.get('indices')} | material={pr.get('material')}")
              for n in fbxs:
                  b=z.read(n); out.append(f"\nFBX: {n} | {len(b):,} bytes | header={b[:23]!r}")
                  out.append("FBX format: " + ("binary FBX signature detected" if b.startswith(b'Kaydara FBX Binary') else "ASCII/text FBX candidate" if b'FBX' in b[:256] or b'Objects:' in b[:2048] else "Unrecognized FBX header"))
              out.append("\nNOTE: Structural inspection only. Blender/Unity import, rig deformation, animation playback, materials, and Android performance require application-level testing.")
          except Exception as e:
              out.append(f"INSPECTION FAILED: {type(e).__name__}: {e}")
              raise
          report="\n".join(out)
          print(report)
          open("Nero-1-inspection-report.txt","w").write(report)
          PY
      - name: Blender application-level import and rig checks
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y blender python3-numpy
          blender --background --python-expr "import numpy; print('Blender NumPy:', numpy.__version__)"
          blender --background --python tools/repair_nero_assets.py 2>&1 | tee repair-run.log
          mkdir -p extracted
          python3 - <<'PY'
          import zipfile
          with zipfile.ZipFile("Nero 1 REPAIRED.zip") as z:
              z.extractall("extracted")
          PY
          cat > blender_check.py <<'PY'
          import bpy, os, sys
          root=os.path.abspath("extracted/NERO_FINAL")
          report=["BLENDER HEADLESS IMPORT VALIDATION","="*38]
          targets=[
            ("GLB main","Models/NERO_Final.glb","glb"),
            ("GLB LOD0","Models/NERO_LOD0.glb","glb"),
            ("GLB LOD1","Models/NERO_LOD1.glb","glb"),
            ("GLB LOD2","Models/NERO_LOD2.glb","glb"),
            ("GLB rifle","Weapons/Rifle_Model.glb","glb")]
          for label,rel,kind in targets:
            path=os.path.join(root,rel)
            bpy.ops.wm.read_factory_settings(use_empty=True)
            report.append("\n"+label+": "+rel)
            try:
              bpy.ops.import_scene.gltf(filepath=path)
              objs=list(bpy.context.scene.objects)
              meshes=[o for o in objs if o.type=="MESH"]
              arms=[o for o in objs if o.type=="ARMATURE"]
              actions=list(bpy.data.actions)
              verts=sum(len(o.data.vertices) for o in meshes)
              polys=sum(len(o.data.polygons) for o in meshes)
              tris=sum(sum(1 for _ in p.vertices) - 2 for o in meshes for p in o.data.polygons)
              bones=sum(len(a.data.bones) for a in arms)
              mats=sum(len(o.data.materials) for o in meshes)
              groups=sum(len(o.vertex_groups) for o in meshes)
              weighted=0; max_influences=0
              for o in meshes:
                for v in o.data.vertices:
                  influences=sum(1 for g in v.groups if g.weight>0.00001)
                  if influences: weighted+=1
                  max_influences=max(max_influences,influences)
              report.append("IMPORT: PASS")
              report.append(f"Objects={len(objs)} meshes={len(meshes)} vertices={verts} polygons={polys} approx_triangles={tris}")
              report.append(f"Armatures={len(arms)} bones={bones} actions={len(actions)} materialslots={mats} vertex_groups={groups}")
              report.append(f"Vertices with weights={weighted}/{verts} max_influences_per_vertex={max_influences}")
              report.append("Actions: "+", ".join(a.name for a in actions[:45]))
              report.append("Mesh objects: "+", ".join(o.name for o in meshes[:20]))
              if not meshes: report.append("WARNING: no mesh geometry imported")
            except Exception as e:
              report.append("IMPORT: FAIL - "+repr(e))
          open("Blender-validation-report.txt","w").write("\n".join(report))
          print("\n".join(report))
          PY
          blender --background --python blender_check.py 2>&1 | tee blender-run.log
          cat Blender-validation-report.txt >> Nero-1-inspection-report.txt
      - name: Upload repaired model ZIP
        uses: actions/upload-artifact@v4
        with:
          name: nero-1-repaired-model
          path: 'Nero 1 REPAIRED.zip'
          if-no-files-found: error
          retention-days: 30
      - name: Commit repaired ZIP to repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "Nero 1 REPAIRED.zip"
          if ! git diff --cached --quiet; then
            git commit -m "Add repaired NERO 1 model package"
            git push
          fi
      - name: Upload Blender validation report
        uses: actions/upload-artifact@v4
        with:
          name: nero-1-blender-validation
          path: Blender-validation-report.txt
          if-no-files-found: error
          retention-days: 7
      - name: Upload inspection report
        uses: actions/upload-artifact@v4
        with:
          name: nero-1-inspection-report
          path: Nero-1-inspection-report.txt
          if-no-files-found: error
          retention-days: 7
      - name: Upload original ZIP
        uses: actions/upload-artifact@v4
        with:
          name: nero-1-model-source
          path: 'Nero 1.zip'
          if-no-files-found: error
          retention-days: 7

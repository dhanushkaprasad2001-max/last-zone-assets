name: Export 3D model ZIP
on:
  push:
    paths:
      - '.github/workflows/export-model-zip.yml'
      - 'game-LAST-ZONE-COD-Pack.zip'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  export-model:
    runs-on: ubuntu-latest
    steps:
      - name: Check out assets
        uses: actions/checkout@v4
      - name: Verify model archive
        run: |
          test -s game-LAST-ZONE-COD-Pack.zip
          file game-LAST-ZONE-COD-Pack.zip
          unzip -t game-LAST-ZONE-COD-Pack.zip
      - name: List archive contents
        run: unzip -Z1 game-LAST-ZONE-COD-Pack.zip
      - name: Upload original model archive
        uses: actions/upload-artifact@v4
        with:
          name: nero-cod-model-source
          path: game-LAST-ZONE-COD-Pack.zip
          if-no-files-found: error
          retention-days: 7

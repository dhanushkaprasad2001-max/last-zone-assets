name: Export NERO model ZIP
on:
  push:
    paths:
      - '.github/workflows/export-model-zip.yml'
      - 'Nero new.zip'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  export-model:
    runs-on: ubuntu-latest
    steps:
      - name: Check out assets
        uses: actions/checkout@v4
      - name: Verify model archive
        run: |
          test -s "Nero new.zip"
          file "Nero new.zip"
          unzip -t "Nero new.zip"
      - name: List archive contents
        run: unzip -Z1 "Nero new.zip"
      - name: Upload original model archive
        uses: actions/upload-artifact@v4
        with:
          name: nero-new-model-source
          path: "Nero new.zip"
          if-no-files-found: error
          retention-days: 7
